[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-tracker"
version = "0.1.0"
description = "Monitors Allu Cinemas Hyderabad on BookMyShow for Dolby 2D bookings"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.11.0",
    "curl-cffi>=0.9.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0",
]

[project.scripts]
bms-tracker = "bms_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
