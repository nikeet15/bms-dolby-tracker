[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-tracker"
version = "0.1.0"
description = "Monitors AAA Cinemas Hyderabad on BookMyShow for Dolby 2D bookings"
dependencies = [
    "beautifulsoup4>=4.11.0",
    "playwright>=1.40.0",
]

[project.scripts]
bms-tracker = "bms_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]